<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174f50" />
    <meta name="description" content="Sleepcare's new website is coming soon. Get in touch with us while we prepare our new online home." />
    <title>Coming soon | Sleepcare</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", Arial, sans-serif;
        color: #193c3c;
        background: #f2f6f3;
      }

      * { box-sizing: border-box; }

      body { margin: 0; }

      .page {
        display: grid;
        grid-template-columns: minmax(0, 47%) minmax(0, 53%);
        min-height: 100svh;
      }

      .content {
        display: flex;
        flex-direction: column;
        padding: clamp(28px, 4vw, 68px) clamp(28px, 6vw, 96px);
      }

      .brand {
        align-self: flex-start;
      }

      .brand-logo {
        display: block;
        width: clamp(200px, 16vw, 250px);
        height: auto;
        mix-blend-mode: multiply;
      }

      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        max-width: 550px;
        padding: 78px 0 95px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 32px;
        color: #236768;
        font-size: 14px;
        font-weight: 700;
      }

      .status::before {
        width: 29px;
        height: 2px;
        background: #2b8886;
        content: "";
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(55px, 5.7vw, 93px);
        font-weight: 400;
        letter-spacing: -.055em;
        line-height: .99;
      }

      .intro {
        max-width: 390px;
        margin: 34px 0 0;
        color: #55706e;
        font-size: clamp(17px, 1.5vw, 20px);
        line-height: 1.65;
      }

      .contact-links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 37px;
      }

      .contact {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 54px;
        padding: 0 26px;
        border-radius: 4px;
        background: #174f50;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: background .2s ease;
      }

      .contact:active { background: #0b7470; }
      .contact:focus-visible { outline: 3px solid #30358c; outline-offset: 4px; }

      @media (hover: hover) and (pointer: fine) {
        .contact:hover { background: #0b7470; }
      }

      footer {
        color: #6b8380;
        font-size: 13px;
        line-height: 1.5;
      }

      .photo {
        position: relative;
        min-height: 500px;
        overflow: hidden;
        background: #557b76;
      }

      .photo svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      @media (max-width: 800px) {
        .page { grid-template-columns: 1fr; }
        .content { min-height: 590px; padding: 30px clamp(25px, 7vw, 56px) 25px; }
        main { padding: 75px 0 72px; }
        h1 { max-width: 620px; font-size: clamp(52px, 11vw, 82px); }
        .photo { min-height: 0; height: min(75vw, 580px); }
      }

      @media (max-width: 460px) {
        .content { min-height: 0; }
        main { padding: 70px 0 65px; }
        .status { margin-bottom: 25px; }
        .intro { margin-top: 26px; }
        .photo { height: 80vw; }
      }

      @media (prefers-reduced-motion: reduce) {
        .contact { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="content">
        <div class="brand">
          <svg class="brand-logo" viewBox="140 400 1720 650" role="img" aria-label="Premium Sleepcare medicated mattress">
            <image href="sleepcare-logo.png" width="2000" height="1414" />
          </svg>
        </div>

        <main>
          <p class="status">Our new website is on its way</p>
          <h1>Rest easy.<br />We're almost here.</h1>
          <p class="intro">A new online home for Sleepcare is coming soon. Have a question in the meantime? We'd love to hear from you.</p>
          <div class="contact-links">
            <a class="contact" href="https://wa.me/919207064444" target="_blank" rel="noopener noreferrer">WhatsApp</a>
            <a class="contact" href="tel:+919207064444">Call</a>
            <a class="contact" href="mailto:barzatrading@gmail.com?subject=Sleepcare%20enquiry">Email us</a>
          </div>
        </main>

        <footer>Sleepcare by Barza Trading Co.</footer>
      </div>

      <div class="photo">
        <svg viewBox="0 0 1400 1037" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="photoTitle">
          <title id="photoTitle">Sleepcare mattress in a calm bedroom with the original Sleepcare logo</title>
          <image href="sleepcare-room.png" width="1400" height="1037" />
          <image href="sleepcare-logo.png" x="440" y="81" width="520" height="270" preserveAspectRatio="xMidYMid slice" />
        </svg>
      </div>
    </div>
  </body>
</html>
