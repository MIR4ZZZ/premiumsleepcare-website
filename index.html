<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#174f50" />
    <meta name="description" content="Sleepcare's new website is coming soon. Get in touch with us while we prepare our new online home." />
    <title>Coming soon | Sleepcare</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", Arial, sans-serif;
        color: #193c3c;
        background: #f2f6f3;
      }

      * { box-sizing: border-box; }

      body { margin: 0; }

      .page {
        display: grid;
        grid-template-columns: minmax(0, 47%) minmax(0, 53%);
        min-height: 100svh;
      }

      .content {
        display: flex;
        flex-direction: column;
        padding: clamp(28px, 4vw, 68px) clamp(28px, 6vw, 96px);
      }

      .brand {
        display: inline-flex;
        flex-direction: column;
        align-self: flex-start;
        line-height: 1;
        text-decoration: none;
      }

      .brand-name {
        font-size: clamp(31px, 3.1vw, 47px);
        font-style: italic;
        font-weight: 700;
        letter-spacing: -.07em;
      }

      .brand-name span:first-child { color: #30358c; }
      .brand-name span:last-child { color: #079951; }

      .brand-caption {
        margin-top: 7px;
        color: #5b6766;
        font-size: 10px;
        letter-spacing: .27em;
        text-transform: uppercase;
      }

      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        max-width: 550px;
        padding: 78px 0 95px;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 32px;
        color: #236768;
        font-size: 14px;
        font-weight: 700;
      }

      .status::before {
        width: 29px;
        height: 2px;
        background: #2b8886;
        content: "";
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(55px, 5.7vw, 93px);
        font-weight: 400;
        letter-spacing: -.055em;
        line-height: .99;
      }

      .intro {
        max-width: 390px;
        margin: 34px 0 0;
        color: #55706e;
        font-size: clamp(17px, 1.5vw, 20px);
        line-height: 1.65;
      }

      .contact {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        align-self: flex-start;
        min-height: 54px;
        margin-top: 37px;
        padding: 0 26px;
        border-radius: 4px;
        background: #174f50;
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition: background .2s ease;
      }

      .contact:active { background: #0b7470; }
      .contact:focus-visible { outline: 3px solid #30358c; outline-offset: 4px; }

      @media (hover: hover) and (pointer: fine) {
        .contact:hover { background: #0b7470; }
      }

      footer {
        color: #6b8380;
        font-size: 13px;
        line-height: 1.5;
      }

      .photo {
        position: relative;
        min-height: 500px;
        overflow: hidden;
        background: #557b76;
      }

      .photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      @media (max-width: 800px) {
        .page { grid-template-columns: 1fr; }
        .content { min-height: 590px; padding: 30px clamp(25px, 7vw, 56px) 25px; }
        main { padding: 75px 0 72px; }
        h1 { max-width: 620px; font-size: clamp(52px, 11vw, 82px); }
        .photo { min-height: 0; height: min(75vw, 580px); }
      }

      @media (max-width: 460px) {
        .content { min-height: 0; }
        main { padding: 70px 0 65px; }
        .status { margin-bottom: 25px; }
        .intro { margin-top: 26px; }
        .photo { height: 80vw; }
      }

      @media (prefers-reduced-motion: reduce) {
        .contact { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="content">
        <div class="brand" aria-label="Sleepcare medicated mattress">
          <div class="brand-name"><span>Sleep</span><span>care</span></div>
          <div class="brand-caption">Medicated mattress</div>
        </div>

        <main>
          <p class="status">Our new website is on its way</p>
          <h1>Rest easy.<br />We're almost here.</h1>
          <p class="intro">A new online home for Sleepcare is coming soon. Have a question in the meantime? We'd love to hear from you.</p>
          <a class="contact" href="mailto:barzatrading@gmail.com?subject=Sleepcare%20enquiry">Email us</a>
        </main>

        <footer>Sleepcare by Barza Trading Co.</footer>
      </div>

      <div class="photo">
        <img src="sleepcare-room.png" alt="Sleepcare mattress in a calm bedroom" />
      </div>
    </div>
  </body>
</html>
